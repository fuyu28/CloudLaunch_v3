version: "2"

run:
  # Wails の Linux の既定の実装は cgo で WebKitGTK を使い、ヘッダのない CI の Ubuntu では GUI を型検査できない。purego の実装は
  # cgo を使わないので、リントだけこちらで検査する。Windows の Wails には関係しない
  build-tags:
    - purego

linters:
  default: standard
  enable:
    - testpackage
  settings:
    testpackage:
      # 既定では export_test.go / internal_test.go を内部パッケージのまま許すが、公開 API 経由のテストの抜け道になるので許さない
      skip-regexp: "^$"
  exclusions:
    rules:
      # 公開 API 経由のテストを強制するのはコアだけ。store・platform は SQL や OS の細部を内部から確かめる
      - path-except: ^internal/(syncore|metasync|legacy)/
        linters:
          - testpackage

formatters:
  enable:
    - gofmt
    - goimports
