[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
lefthook = "2.2.2"

[tasks.spec-ids]
description = "仕様書の ID のうち、テストのケース名に現れないものを一覧にする"
run = "scripts/spec-ids.sh"

# Windows の mise は cmd で実行するので、^ や ' を使わない。時間は `mise run fuzz -- -fuzztime 30m` で上書きする
[tasks.fuzz]
description = "manifest の path の検証を fuzz で探索する。見つかった入力は internal/syncore/testdata/fuzz/ に保存される"
run = "go test ./internal/syncore -run NONE -fuzz FuzzPull -fuzztime 5m"

[env]
_.file = { path = ".env", redact = true }
