name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 対象を「変わったら走らせるもの」の列挙にすると、埋め込みの SQL やテストのコーパスのような書き漏れで検査が飛ぶので、
  # 「走らせなくてよいもの」を除く形にする
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect changed areas
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'

  lint:
    name: Lint (${{ matrix.goos }})
    needs: changes
    # dev と main への push では、取り込んだ結果を確かめるため常に走らせる
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      # run は formatters の差分を報告しないので、fmt --diff で別に確かめる。結果は GOOS に依らないため 1 回だけ行う
      - name: Check formatting
        if: matrix.goos == 'linux'
        run: golangci-lint fmt --diff ./...

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # service コンテナには起動の引数を渡せず、Windows のランナーでは Linux のコンテナを動かせないので、Ubuntu の手順の中で立てる
      - name: Start S3-compatible server
        if: runner.os == 'Linux'
        run: |
          docker compose up -d --wait
          {
            echo "CLOUDLAUNCH_TEST_S3_ENDPOINT=http://127.0.0.1:7070"
            echo "CLOUDLAUNCH_TEST_S3_BUCKET=cloudlaunch-test"
            echo "CLOUDLAUNCH_TEST_S3_ACCESS_KEY_ID=testuser"
            echo "CLOUDLAUNCH_TEST_S3_SECRET_ACCESS_KEY=testsecret"
          } >> "$GITHUB_ENV"

      - name: Test
        run: go test -race -cover ./...

  # 仕様書の変更（.md だけの PR）でも一覧が変わるので、changes の結果によらず走らせる
  spec-ids:
    name: Spec IDs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List spec IDs without tests
        run: scripts/spec-ids.sh >> "$GITHUB_STEP_SUMMARY"

  # ブランチ保護の必須チェックはこのジョブだけにする。matrix のジョブを if で飛ばすとチェック名が展開されずに報告され、
  # 必須チェックの名前と合わなくなるため。ジョブを足したら needs にも足す
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, lint, test, spec-ids]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 飛ばしたジョブ（skipped）は成功として扱う
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
