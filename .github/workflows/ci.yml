name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      # run は formatters の差分を報告しないので、fmt --diff で別に確かめる。結果は GOOS に依らないため 1 回だけ行う
      - name: Check formatting
        if: matrix.goos == 'linux'
        run: golangci-lint fmt --diff ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # service コンテナには起動の引数を渡せず、Windows のランナーでは Linux のコンテナを動かせないので、Ubuntu の手順の中で立てる
      - name: Start S3-compatible server
        if: runner.os == 'Linux'
        run: |
          docker compose up -d --wait
          {
            echo "CLOUDLAUNCH_TEST_S3_ENDPOINT=http://127.0.0.1:7070"
            echo "CLOUDLAUNCH_TEST_S3_BUCKET=cloudlaunch-test"
            echo "CLOUDLAUNCH_TEST_S3_ACCESS_KEY_ID=testuser"
            echo "CLOUDLAUNCH_TEST_S3_SECRET_ACCESS_KEY=testsecret"
          } >> "$GITHUB_ENV"

      - name: Test
        run: go test -race -cover ./...
