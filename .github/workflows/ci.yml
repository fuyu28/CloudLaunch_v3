name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 対象を「変わったら走らせるもの」の列挙にすると、埋め込みの SQL やテストのコーパスのような書き漏れで検査が飛ぶので、
  # 「走らせなくてよいもの」を除く形にする。フロントだけの変更では、結果の変わる Go のテストがない（UI にはテストを書かない）
  # ので、Go のリントとテストを飛ばす。Go の変更はバインディングを通じてフロントを壊しうるので、フロントのジョブも走らせる
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Detect changed areas
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            go:
              - '**'
              - '!**/*.md'
              - '!cmd/cloudlaunch-gui/frontend/**'
            frontend:
              - 'cmd/cloudlaunch-gui/frontend/**'

  lint:
    name: Lint (${{ matrix.goos }})
    needs: changes
    # dev と main への push では、取り込んだ結果を確かめるため常に走らせる
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      # run は formatters の差分を報告しないので、fmt --diff で別に確かめる。結果は GOOS に依らないため 1 回だけ行う
      - name: Check formatting
        if: matrix.goos == 'linux'
        run: golangci-lint fmt --diff ./...

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # service コンテナには起動の引数を渡せず、Windows のランナーでは Linux のコンテナを動かせないので、Ubuntu の手順の中で立てる
      - name: Start S3-compatible server
        if: runner.os == 'Linux'
        run: |
          docker compose up -d --wait
          {
            echo "CLOUDLAUNCH_TEST_S3_ENDPOINT=http://127.0.0.1:7070"
            echo "CLOUDLAUNCH_TEST_S3_BUCKET=cloudlaunch-test"
            echo "CLOUDLAUNCH_TEST_S3_ACCESS_KEY_ID=testuser"
            echo "CLOUDLAUNCH_TEST_S3_SECRET_ACCESS_KEY=testsecret"
          } >> "$GITHUB_ENV"

      # go test はテストのない GUI のパッケージもビルドし、Wails の Linux の実装は WebKitGTK のヘッダが要るので、Linux では
      # GUI を外す（Linux 向けの GUI のコードはリントが purego で型検査する）。テストに purego のタグを付けないのは、標準ライブラリの
      # crypto もアセンブリのない実装に変わり、本番と違うコードでテストすることになるため
      - name: Test
        if: runner.os == 'Linux'
        run: go test -race -cover $(go list ./... | grep -v '/cmd/cloudlaunch-gui$')

      - name: Test
        if: runner.os == 'Windows'
        run: go test -race -cover ./...

  frontend:
    name: Frontend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd/cloudlaunch-gui/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 手元と同じ版を使うよう、mise.toml から入れる。リンタなど、このジョブで使わないものは入れない。wails3 の CLI は
      # Wails の Linux の実装を取り込み、cgo では WebKitGTK のヘッダを要求するので、cgo なしでビルドする
      - name: Set up tools
        uses: jdx/mise-action@v5
        env:
          CGO_ENABLED: "0"
        with:
          install_args: go bun go:github.com/wailsapp/wails/v3/cmd/wails3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      # Wails は //go:embed でフロントのビルド結果を取り込むので、埋め込むパスが変わると Go のビルドが壊れる。フロントだけの
      # 変更では Go のテストを飛ばすので、ここでビルドして確かめる。Linux 向けは WebKitGTK のヘッダが要るので、本番の Windows 向けにする
      - name: Build GUI
        env:
          GOOS: windows
        run: go build -tags production -o /dev/null ..

      # Linux の Wails は cgo で WebKitGTK を使い、ヘッダのない CI ではパッケージを読めないので、Windows 向けとして読む。
      # 生成するのはサービスの型からなので、結果は GOOS に依らない
      - name: Check bindings are up to date
        env:
          GOOS: windows
        run: |
          mise run gui-bindings
          if [ -n "$(git status --porcelain -- bindings)" ]; then
            git status --short -- bindings
            echo "::error::バインディングが Go の側と合っていません。mise run gui-bindings で生成し直してコミットしてください"
            exit 1
          fi

  # 仕様書の変更（.md だけの PR）でも一覧が変わるので、changes の結果によらず走らせる
  spec-ids:
    name: Spec IDs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List spec IDs without tests
        run: scripts/spec-ids.sh >> "$GITHUB_STEP_SUMMARY"

  # ブランチ保護の必須チェックはこのジョブだけにする。matrix のジョブを if で飛ばすとチェック名が展開されずに報告され、
  # 必須チェックの名前と合わなくなるため。ジョブを足したら needs にも足す
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, lint, test, frontend, spec-ids]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 飛ばしたジョブ（skipped）は成功として扱う
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
